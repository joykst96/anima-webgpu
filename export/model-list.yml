# Anima WebGPU 모델 목록 — gen_models.py가 이 파일을 읽어 web/js/config.js에 주입한다.
#   python export/gen_models.py export/model-list.yml web/js/config.js
#
# 이 파일은 git용 기본 목록(원본 anima만)이고, 레포의 web/js/config.js는 이 목록으로 만든 것이다.
# 자기 배포 목록은 따로 두고(git 제외) 결과도 따로 쓴다:
#   python export/gen_models.py <내 목록>.yml web/js/config.js --out <내 config>.js
#   → 배포할 때 그 파일을 js/config.js로 올리고, 로컬에서는 devserver --config <내 config>.js
# 모델 추가:
#   1. build_dit.bat <ckpt> <key>   → out/dit/{key}_dit_*.onnx 산출
#   2. models: 에 항목 추가 (key = build_dit prefix)
#   3. gen_models.py 다시 실행
#
# 경로 규칙 (key + variant):
#   base  out/dit/{key}_dit_dyn32_q8a4f{ns,Ls}.onnx
#   turbo out/dit/{key}_dit_turbo32_q8a4f{ns,Ls}.onnx

prompt_defaults:
  positive: "masterpiece, best quality, score_7, safe"
  negative: "worst quality, low quality, score_1, score_2, score_3, artist name, nsfw"

paths:
  te: out/text_encoder/qwen3_06b_s.onnx
  adapter: out/adapter/anima_llm_adapter.onnx
  vae: out/vae/qwen_image_vae_decoder_dyn32_2dc.onnx

defaults:
  base:
    steps: 30
    cfg: 5.0
    sampler: er_sde
    scheduler: simple
    label_suffix: "(베이스 · 30스텝 · CFG 5)"
  turbo:
    steps: 8
    cfg: 1.0
    sampler: euler
    scheduler: simple
    label_suffix: "(8스텝 · CFG 1)"

selected: anima_turbo

# 선택 항목 (없으면 기본값):
# convert_url: https://convert.example.com/    # 변환 페이지 주소 (기본: 같은 도메인의 convert/)
# tag_helper_url: https://tags.example.com/     # 긍정 프롬프트 옆 '태그 도우미' 배지 링크 (기본: 배지 숨김)
# sources_title: "파인튜닝 모델 출처"            # 하단 출처 링크 묶음의 제목

models:
  - key: anima
    label: Anima
    variants: [base, turbo]
    overrides:
      turbo:
        label: "Anima+Turbo v0.2"
