services:
  anima-web:
    image: nginx:alpine
    container_name: anima-baepo
    restart: unless-stopped
    environment:
      TZ: "Asia/Seoul"
    ports:
      - "8480:80"          # cloudflared ingress가 바라볼 포트
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      # 모듈 분리 이후 페이지 구성 (web/ 의 하위 폴더를 그대로 복사해 둘 것)
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./workers:/usr/share/nginx/html/workers:ro
      - ./out:/usr/share/nginx/html/out:ro
      - ./tokenizers:/usr/share/nginx/html/tokenizers:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
