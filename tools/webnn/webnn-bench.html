<!doctype html>
<meta charset="utf-8">
<title>webnn-bench</title>
<!--
  WebNN EP와 WebGPU EP의 시간 비교 (DiT 블록을 본뜬 정적 그래프, out-local/webnn-bench/*.onnx).
  devserver(--local-out out-local)에서 /__tools/webnn/webnn-bench.html 로 열고 콘솔에서:
    await bench({ graph: "block_fp16", ep: "webnn-gpu", bundle: "ort.all.bundle.min.mjs" })
    await bench({ graph: "block_best", ep: "webgpu",    bundle: "ort.jspi.bundle.min.mjs" })
  WebNN은 Chrome을 --enable-features=WebMachineLearningNeuralNetwork 로 띄워야 navigator.ml이 생긴다.
  변형마다 새 페이지(새 브라우저)에서 잰다 — ORT 번들과 GPU 버퍼 캐시가 섞이지 않게.
-->
<script type="module">
const base = (v) => `https://cdn.jsdelivr.net/npm/onnxruntime-web@${v}/dist/`;
const median = (a) => [...a].sort((x, y) => x - y)[a.length >> 1];

window.bench = async ({ graph, ep, bundle, ver = "1.26.0", warm = 2, runs = 5, verbose = false, epOpts = {}, f16 = graph.endsWith("fp16"), sessOpts = {} }) => {
  const logs = [];
  if (verbose) for (const k of ["log", "warn", "error", "info", "debug"]) {
    const o = console[k];
    console[k] = (...a) => { const s = a.join(" "); if (/WebNN|WebGPU|placed|fallback|CPUExecution|not supported/i.test(s) && logs.length < 60) logs.push(s.slice(0, 300)); o.apply(console, a); };
  }
  const ort = await import(base(ver) + bundle);
  ort.env.wasm.wasmPaths = base(ver);
  ort.env.wasm.proxy = false;
  const eps = ep === "webgpu" ? ["webgpu"] : ep === "wasm" ? ["wasm"] : [{ name: "webnn", deviceType: ep.split("-")[1], ...epOpts }];
  const t0 = performance.now();
  const sess = await ort.InferenceSession.create(`/out/webnn-bench/${graph}.onnx`, {
    executionProviders: eps, ...(verbose ? { logSeverityLevel: 0 } : {}), ...sessOpts,
  });
  const create = performance.now() - t0;
  const mk = (seed) => {
    const a = new Float32Array(2048);
    for (let i = 0; i < a.length; i++) a[i] = Math.sin(i * 0.37 + seed) * 0.5;
    return f16 ? new ort.Tensor("float16", new Float16Array(a), [1, 1, 2048]) : new ort.Tensor("float32", a, [1, 1, 2048]);
  };
  const times = []; let first = null, last = null;
  for (let i = 0; i < warm + runs; i++) {
    const t = performance.now();
    const out = await sess.run({ x: mk(i < warm ? 0 : i) });
    const y = out.y.data ?? (await out.y.getData());
    const dt = performance.now() - t;
    if (i === 0) first = Array.from(y, Number).map((v) => +v.toFixed(4));
    if (i >= warm) times.push(+dt.toFixed(1));
    if (i === warm + runs - 1) last = Array.from(y, Number).map((v) => +v.toFixed(4)); // 입력이 매번 달라 실제 계산 여부를 EP끼리 대조
    out.y.dispose?.();
  }
  return { graph, ep, bundle, ver, create_ms: Math.round(create), warm_first_out: first, last_out: last, times, median_ms: median(times), logs };
};
// WebNN 호출 추적: 세션 생성이 멈출 때 build() 전인지(그래프 조립 중) 후인지(브라우저 쪽 컴파일) 가른다.
window.traceWebNN = () => {
  const d = (window.__diag ??= {}); d.nn = { ops: 0, last: null, build: "not called", lost: null };
  const P = MLGraphBuilder.prototype;
  for (const k of Object.getOwnPropertyNames(P)) {
    const f = P[k]; if (typeof f !== "function" || k === "constructor") continue;
    P[k] = function (...a) {
      if (k === "build") { d.nn.build = "pending"; d.nn.t0 = performance.now();
        return f.apply(this, a).then((g) => { d.nn.build = "resolved " + Math.round(performance.now() - d.nn.t0) + "ms"; return g; }, (e) => { d.nn.build = "rejected: " + e; throw e; }); }
      d.nn.ops++; d.nn.last = k;
      try { return f.apply(this, a); } catch (e) { (d.nn.errs ??= []).push(k + ": " + String(e).slice(0, 300)); throw e; }
    };
  }
  const cc = navigator.ml.createContext.bind(navigator.ml);
  navigator.ml.createContext = async (...a) => { const c = await cc(...a); c.lost?.then((i) => { d.nn.lost = i?.message ?? String(i); }); return c; };
};

// ── 실제 DiT 그래프 (정적 shape, 입력 latent/timesteps/context) ──
// 입력은 시드 고정 가우시안이라 EP·브라우저가 달라도 같은 값. returnOut이면 출력 fp32를 base64로 돌려준다(실행기가 파일로 저장).
function randn(n, seed) {
  let a = seed >>> 0;
  const u = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const o = new Float32Array(n);
  for (let i = 0; i < n; i += 2) {
    const r = Math.sqrt(-2 * Math.log(u() + 1e-12)), th = 2 * Math.PI * u();
    o[i] = r * Math.cos(th); if (i + 1 < n) o[i + 1] = r * Math.sin(th);
  }
  return o;
}
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

window.benchDit = async ({ graph, ep, bundle, ver = "1.26.0", warm = 2, runs = 5, verbose = false, epOpts = {}, data = null,
                           lat = 128, latH = lat, latW = lat, sigma = 0.5, ctxScale = 1, feeds = null, returnOut = false, sessOpts = {}, trace = false, dir = "/out/webnn-bench/", negpip = false, preload = false, second = null }) => {
  const logs = []; window.__diag = { stage: "import", logs };
  if (trace) traceWebNN();
  if (verbose) for (const k of ["log", "warn", "error", "info", "debug"]) {
    const o = console[k];
    console[k] = (...a) => { const s = a.join(" "); window.__diag.last = s.slice(0, 300); (window.__diag.tail ??= []).push(s.slice(0, 200)); if (window.__diag.tail.length > 6) window.__diag.tail.shift(); if (/supported by WebNN|placed on|fallback|not supported|CPUExecutionProvider\]|WebNN.*(fail|error)/i.test(s) && logs.length < 80) logs.push(s.slice(0, 400)); o.apply(console, a); };
  }
  const ort = await import(base(ver) + bundle);
  ort.env.wasm.wasmPaths = base(ver);
  ort.env.wasm.proxy = false;
  const eps = ep === "webgpu" ? ["webgpu"] : ep === "wasm" ? ["wasm"] : [{ name: "webnn", deviceType: ep.split("-")[1], ...epOpts }];
  const files = data ?? [graph + ".onnx.data"];
  // preload: 가중치를 먼저 메모리에 받아 두고 세션 생성 시간만 잰다(해상도 전환 비용 = 다운로드 없는 재생성)
  const blobs = preload ? await Promise.all(files.map(async (p) => new Uint8Array(await (await fetch(dir + p)).arrayBuffer()))) : null;
  const graphBytes = preload ? new Uint8Array(await (await fetch(`${dir}${graph}.onnx`)).arrayBuffer()) : `${dir}${graph}.onnx`;
  const extData = () => files.map((p, i) => ({ path: p, data: blobs ? blobs[i] : `${dir}${p}` }));
  window.__diag.stage = "create";
  const t0 = performance.now();
  let sess = await ort.InferenceSession.create(graphBytes, {
    executionProviders: eps, externalData: extData(),
    ...(verbose ? { logSeverityLevel: 0 } : {}), ...sessOpts,
  });
  const create = performance.now() - t0;
  const f16t = (f32, dims) => new ort.Tensor("float16", new Float16Array(f32), dims);
  let latent, context;
  if (feeds) { // 파이썬 기준과 같은 입력: fp32 little-endian 원시 파일
    const get = async (p) => new Float32Array(await (await fetch(`/out/webnn-bench/${p}`)).arrayBuffer());
    latent = await get(feeds.latent); context = await get(feeds.context);
  } else {
    latent = randn(16 * latH * latW, 1234);
    context = randn(512 * 1024, 5678); for (let i = 0; i < context.length; i++) context[i] *= ctxScale;
  }
  const mk = () => ({ latent: f16t(latent, [1, 16, 1, latH, latW]), timesteps: new ort.Tensor("float32", new Float32Array([sigma]), [1]), context: f16t(context, [1, 512, 1024]),
    ...(negpip ? { negpip_mask: f16t(new Float32Array(512).fill(1), [1, 512, 1]) } : {}) }); // 운영 그래프용: mask=1이면 출력 불변
  const times = []; let y = null;
  for (let i = 0; i < warm + runs; i++) {
    window.__diag.stage = "run " + i;
    const t = performance.now();
    const out = await sess.run(mk());
    const d = out.v_pred.data ?? (await out.v_pred.getData());
    const dt = performance.now() - t;
    if (i >= warm) times.push(+dt.toFixed(1));
    if (i === warm + runs - 1) y = d instanceof Float32Array ? d : Float32Array.from(d);
    out.v_pred.dispose?.();
  }
  let sw = null;
  if (second) { // 해상도 전환: 세션을 내리고 같은 그래프·가중치로 다른 차원 고정
    window.__diag.stage = "switch";
    const tr = performance.now(); await sess.release(); const rel = performance.now() - tr;
    const tc = performance.now();
    sess = await ort.InferenceSession.create(graphBytes, { executionProviders: eps, externalData: extData(), ...sessOpts, freeDimensionOverrides: { lat_h: second.latH, lat_w: second.latW } });
    const cr = performance.now() - tc, l2 = randn(16 * second.latH * second.latW, 1234), ts = [];
    for (let i = 0; i < 4; i++) { const t = performance.now(); const o = await sess.run({ latent: f16t(l2, [1, 16, 1, second.latH, second.latW]), timesteps: new ort.Tensor("float32", new Float32Array([sigma]), [1]), context: f16t(context, [1, 512, 1024]) }); const d = o.v_pred.data; ts.push(+(performance.now() - t).toFixed(1)); o.v_pred.dispose?.(); }
    sw = { release_ms: Math.round(rel), create_ms: Math.round(cr), times: ts };
  }
  let nan = 0, ss = 0; for (const v of y) { if (!Number.isFinite(v)) nan++; else ss += v * v; }
  return { graph, ep, bundle, ver, create_ms: Math.round(create), times, median_ms: median(times), out_rms: +Math.sqrt(ss / y.length).toFixed(5), nonfinite: nan,
           head: Array.from(y.subarray(0, 6), (v) => +v.toFixed(4)), logs, ...(sw ? { switch: sw } : {}), ...(returnOut ? { out_b64: b64(new Uint8Array(y.buffer, y.byteOffset, y.byteLength)) } : {}) };
};
// ── VAE 디코더 (입력 latent fp16 [1,16,1,H,W], 출력 image fp32 [1,3,8H,8W]) ──
// feed = 실제 생성에서 받은 latent(fp16 원시 파일, /out/webnn-bench/ 기준). 동적 그래프는 sessOpts.freeDimensionOverrides로 차원 고정.
window.benchVae = async ({ graph, ep, bundle, ver = "1.26.0", warm = 2, runs = 5, verbose = false, epOpts = {}, data, dir = "/out/webnn-bench/vae/",
                           latH = 128, latW = 128, feed = "vae_lat_1024.f16", returnOut = false, sessOpts = {}, trace = false }) => {
  const logs = []; window.__diag = { stage: "import", logs };
  if (trace) traceWebNN();
  if (verbose) for (const k of ["log", "warn", "error", "info", "debug"]) {
    const o = console[k];
    console[k] = (...a) => { const s = a.join(" "); window.__diag.last = s.slice(0, 300); if (/supported by WebNN|placed on|fallback|not supported|CPUExecutionProvider\]|WebNN.*(fail|error)/i.test(s) && logs.length < 80) logs.push(s.slice(0, 400)); o.apply(console, a); };
  }
  const ort = await import(base(ver) + bundle);
  ort.env.wasm.wasmPaths = base(ver);
  ort.env.wasm.proxy = false;
  const eps = ep === "webgpu" ? ["webgpu"] : ep === "wasm" ? ["wasm"] : [{ name: "webnn", deviceType: ep.split("-")[1], ...epOpts }];
  window.__diag.stage = "create";
  const t0 = performance.now();
  const sess = await ort.InferenceSession.create(`${dir}${graph}.onnx`, {
    executionProviders: eps, externalData: (data ?? []).map((p) => ({ path: p, data: `${dir}${p}` })), ...(verbose ? { logSeverityLevel: 0 } : {}), ...sessOpts,
  });
  const create = performance.now() - t0;
  const src = new Uint16Array(await (await fetch(`/out/webnn-bench/${feed}`)).arrayBuffer());
  const raw = new Uint16Array(16 * latH * latW); // 크기가 다르면 같은 값을 이어 붙인다(실행 가능 여부·시간만 볼 때)
  for (let i = 0; i < raw.length; i++) raw[i] = src[i % src.length];
  const lat = typeof Float16Array !== "undefined" ? new Float16Array(raw.buffer) : raw;
  const times = []; let y = null;
  for (let i = 0; i < warm + runs; i++) {
    window.__diag.stage = "run " + i;
    const t = performance.now();
    const out = await sess.run({ latent: new ort.Tensor("float16", lat, [1, 16, 1, latH, latW]) });
    const o = out[sess.outputNames[0]], d = o.data ?? (await o.getData());
    const dt = performance.now() - t;
    if (i >= warm) times.push(+dt.toFixed(1));
    if (i === warm + runs - 1) y = d instanceof Float32Array ? d : Float32Array.from(d);
    o.dispose?.();
  }
  let nan = 0; for (const v of y) if (!Number.isFinite(v)) nan++;
  return { graph, ep, bundle, ver, create_ms: Math.round(create), times, median_ms: median(times), nonfinite: nan, n: y.length,
           head: Array.from(y.subarray(0, 6), (v) => +v.toFixed(4)), logs, ...(returnOut ? { out_b64: b64(new Uint8Array(y.buffer, y.byteOffset, y.byteLength)) } : {}) };
};
window.ready = true;
</script>
